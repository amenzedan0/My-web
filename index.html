.topbar{width:100%;max-width:750px;display:flex;justify-content:center;align-items:center;margin-bottom:15px;padding:15px 18px;background:rgba(0,0,0,.5);border:2px solid rgba(0,255,204,.4);border-radius:15px;position:relative;z-index:10}
.brand{font-size:42px;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#00ffcc,#00ffff,#0088ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center}
.settings-btn{position:absolute;left:18px;top:50%;transform:translateY(-50%);background:rgba(0,255,204,.15);border:2px solid #00ffcc;color:#00ffcc;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:20px}
.settings-panel{position:fixed;top:100px;left:15px;background:rgba(15,20,45,.98);border:2px solid #00ffcc;border-radius:15px;padding:18px;display:none;z-index:999;min-width:220px}

.settings-panel input[type=checkbox]{accent-color:#00ffcc;width:18px;height:18px}
.start-screen{max-width:600px;width:100%;margin-top:60px;padding:50px 30px;background:rgba(255,255,255,.06);border:2px solid rgba(0,255,204,.5);border-radius:25px;text-align:center;box-shadow:0 10px 60px rgba(0,0,0,.6)}

.email-box input{width:100%;padding:15px 18px;border-radius:12px;border:2px solid rgba(0,255,204,.4);background:rgba(0,0,0,.4);color:#fff;font-size:16px;direction:ltr;text-align:left}
.email-box input:focus{outline:none;border-color:#00ffcc}
.email-error{color:#ff3355;font-size:13px;margin-top:8px;min-height:18px;font-weight:bold;text-align:right}
.start-btn{background:linear-gradient(135deg,#00ffcc,#0088ff);color:#000;border:none;padding:20px 60px;border-radius:50px;font-size:22px;font-weight:900;cursor:pointer;letter-spacing:3px}

.option{background:rgba(255,255,255,.08);border:2px solid rgba(0,255,204,.4);color:#fff;padding:20px 15px;border-radius:15px;font-size:16px;cursor:pointer;text-align:center;font-weight:bold}
.option:hover{background:rgba(0,255,204,.2);border-color:#00ffcc}

.option.disabled{pointer-events:none}
.option.hidden5050{opacity:.2;text-decoration:line-through}
.help-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.help-btn:hover:not(:disabled){background:#00ffcc;color:#000}

.levels-section.active{display:block}

.levels-title{font-size:20px;color:#00ffcc;font-weight:900 ک}
.levels-progress-text{font-size:14px;color:#ffd700;font-weight:bold}
.levels-grid{display:وردgrid;grid-template-columns:repeat(auto-fill,minmax(55px,1fr));gap:8px;ستانmax-height:450px;overflow-y:auto;padding:10px;background:rgba(0,0,0 ه,.3);border-radius:15px}
.level-item{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;border:2px solid transparent}

.level-item.locked span{display:none}
.level-item.unlocked{background:linear-gradient(135deg,#00ffcc,#0088ff);color:#000}
.level-item.current{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;border-color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}

.modal-content{background:linear-gradient(135deg,#1a1a2e,#0f3460);border:3px solid #00ffcc;border-radius:25px;padding:35px;text-align:center;max-width:420px;width:100%}

.modal-content p{margin-bottom:25px;line-height:1.9;font-size:16px}

.user-email-bar.active{display:block}
.user-email-bar b{color:#fff;direction:ltr}

  {q:"کام ڕەنگی خۆرە؟",a:"زەرد",w:["سوور","شین","سەوز"]},
  {q:"کام ڕەنگی گیا سەوزە؟",a:"سەوز",w:["سوور","شین","زەرد"]},
  {q:"کام ڕەنگی بەفر سپیە؟",a:"سپی",w:["ڕەش","سوور","شین"]},
  {q:"کام وڵات زۆرترین گازی سروشتی هەیە؟",a:"ڕووسیا",w:["ئێران","قەتەر","ئەمریکا"]},
  {q:"کام وڵات زۆرترین مس هەیە؟",a:"چیلی",w:["پێرو","چین","ئەمریکا"]},
  {q:"کام وڵات زۆرترین ئاسنی هەیە؟",a:"ئوسترالیا",w:["بەڕازیل","چین","هیندستان"]},
  {q:"کام وڵات زۆرترین خەڵووزی هەیە؟",a:"چین",w:["ئەمریکا","هیندستان","ئوسترالیا"]},
  {q:"کام وڵات زۆرترین برنج بەرهەمدەهێنێت؟",a:"چین",w:["هیندستان","ئیندۆنیزیا","بەنگلادیش"]}
];

/* ============================================================
   کۆکردنەوەی پرسیارەکان
   ============================================================ */
// زیادکردنی پایتەختی وڵاتان
for (var ci = 0; ci < countriesData.length; ci++) {
  var c = countriesData[ci];
  var wrongCaps = [];
  for (var wj = 0; wj < countriesData.length && wrongCaps.length < 3; wj++) {
    if (countriesData[wj][1] !== c[1]) {
      wrongCaps.push(countriesData[wj][1]);
    }
  }
  questionBank.push({
    q: "پایتەختی " + c[0] + " کام شارە؟",
    a: c[1],
    w: wrongCaps
  });
}

// زیادکردنی پرسیارەکان
var allQ = [kurdistanQs, scienceQs, geoQs, sportsQs, historyQs, artsQs, religionQs, langQs, generalQs];
for (var ai = 0; ai < allQ.length; ai++) {
  for (var qi = 0; qi < allQ[ai].length; qi++) {
    questionBank.push(allQ[ai][qi]);
  }
}

// زیادکردنی پرسیاری بیرکاری
var mathIdx = 0;
for (var mi = 1; mi <= 500 && mathIdx < 500; mi++) {
  var seed = mi * 17 + 23;
  var n1 = (seed % 80) + 5;
  var n2 = ((seed * 3) % 60) + 3;
  var type = mi % 5;
  var qText, ans, wrongs;
  
  if (type === 0) {
    ans = n1 + n2;
    qText = n1 + " + " + n2 + " چەندە؟";
    wrongs = [String(ans+1), String(ans-1), String(ans+2)];
  } else if (type === 1) {
    var big = Math.max(n1, n2);
    var small = Math.min(n1, n2);
    ans = big - small;
    qText = big + " - " + small + " چەندە؟";
    wrongs = [String(ans+1), String(ans-1), String(ans+3)];
  } else if (type === 2) {
    var m1 = (seed % 15) + 2;
    var m2 = ((seed * 3) % 15) + 2;
    ans = m1 * m2;
    qText = m1 + " × " + m2 + " چەندە؟";
    wrongs = [String(ans+m1), String(ans-m2), String(ans+1)];
  } else if (type === 3) {
    var d2 = ((seed * 7) % 12) + 2;
    var r = ((seed * 11) % 12) + 2;
    ans = r;
    qText = (d2*r) + " ÷ " + d2 + " چەندە؟";
    wrongs = [String(ans+1), String(ans-1), String(ans+2)];
  } else {
    ans = n1 + n2 - 1;
    qText = n1 + " + " + n2 + " - 1 چەندە؟";
    wrongs = [String(ans+1), String(ans-1), String(ans+2)];
  }
  
  var isDup = false;
  for (var di = 0; di < questionBank.length; di++) {
    if (questionBank[di].q === qText) { isDup = true; break; }
  }
  if (!isDup) {
    questionBank.push({ q: qText, a: String(ans), w: wrongs });
    mathIdx++;
  }
}

// ئەگەر کەمتر بوو لە ١٠٠٠
var extra = 10000;
while (questionBank.length < 1000) {
  var en1 = (extra * 19) % 900 + 100;
  var en2 = (extra * 31) % 500 + 50;
  var ea = en1 + en2;
  var eq = en1 + " + " + en2 + " چەندە؟";
  var isDup2 = false;
  for (var di2 = 0; di2 < questionBank.length; di2++) {
    if (questionBank[di2].q === eq) { isDup2 = true; break; }
  }
  if (!isDup2) {
    questionBank.push({ q: eq, a: String(ea), w: [String(ea+1), String(ea-1), String(ea+2)] });
  }
  extra++;
}

// تێکەڵکردن
for (var si = questionBank.length - 1; si > 0; si--) {
  var sj = Math.floor(Math.random() * (si + 1));
  var tmp = questionBank[si];
  questionBank[si] = questionBank[sj];
  questionBank[sj] = tmp;
}

console.log("✅ کۆی پرسیارەکان: " + questionBank.length);

/* ============================================================
   دۆخ
   ============================================================ */
var state = {
  currentLevel: 1,
  coins: 0,
  unlockedLevels: 1,
  volume: 0.5,
  soundEnabled: true,
  currentQuestion: null,
  answered: false,
  used5050: false,
  usedSkip: false,
  userEmail: ''
};

function saveState() {
  try {
    localStorage.setItem('amenit_state', JSON.stringify({
      currentLevel: state.currentLevel,
      coins: state.coins,
      unlockedLevels: state.unlockedLevels,
      volume: state.volume,
      soundEnabled: state.soundEnabled,
      userEmail: state.userEmail
    }));
  } catch(e) {}
}

function loadState() {
  try {
    var s = localStorage.getItem('amenit_state');
    if (s) {
      var d = JSON.parse(s);
      state.currentLevel = d.currentLevel || 1;
      state.coins = d.coins || 0;
      state.unlockedLevels = d.unlockedLevels || 1;
      state.volume = d.volume != null ? d.volume : 0.5;
      state.soundEnabled = d.soundEnabled != null ? d.soundEnabled : true;
      state.userEmail = d.userEmail || '';
      document.getElementById('volume').value = state.volume * 100;
      document.getElementById('volVal').textContent = Math.round(state.volume * 100);
      document.getElementById('soundToggle').checked = state.soundEnabled;
    }
  } catch(e) {}
}

/* ============================================================
   ساوند
   ============================================================ */
var audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}

function playTone(freq, dur, type) {
  if (!state.soundEnabled) return;
  try {
    var ctx = getCtx();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = state.volume * 0.3;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}

function playCorrect() {
  playTone(660, 0.15);
  setTimeout(function() { playTone(880, 0.2); }, 120);
  setTimeout(function() { playTone(1100, 0.3); }, 260);
}

function playWrong() {
  playTone(220, 0.4, 'sawtooth');
  setTimeout(function() { playTone(150, 0.5, 'sawtooth'); }, 200);
}

function changeVolume(v) {
  state.volume = v / 100;
  document.getElementById('volVal').textContent = v;
  saveState();
}

function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}

document.addEventListener('click', function(e) {
  var panel = document.getElementById('settingsPanel');
  var btn = document.querySelector('.settings-btn');
  if (panel && btn && !panel.contains(e.target) && !btn.contains(e.target)) {
    panel.classList.remove('open');
  }
});

document.getElementById('soundToggle').addEventListener('change', function(e) {
  state.soundEnabled = e.target.checked;
  saveState();
});

/* ============================================================
   دەستپێکردن
   ============================================================ */
function startGame() {
  var input = document.getElementById('emailInput');
  var email = (input.value || '').trim();
  var errBox = document.getElementById('emailError');

  if (email.length < 3) {
    errBox.textContent = '⚠️ تکایە ئیمێلەکەت بنووسە';
    input.focus();
    return;
  }
  if (email.indexOf('@') === -1 || email.indexOf('.') === -1) {
    errBox.textContent = '⚠️ پێویستە @ و . ی تێدا بێت — نموونە: ali@gmail.com';
    input.focus();
    return;
  }

  errBox.textContent = '';
  state.userEmail = email;
  saveState();

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').classList.add('active');
  document.getElementById('levelsSection').classList.add('active');

  var bar = document.getElementById('userEmailBar');
  bar.classList.add('active');
  document.getElementById('userEmailDisplay').textContent = email;

  loadLevel(state.currentLevel || 1);
}

// پەیوەستکردنی دوگمەکە
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('emailInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') startGame();
});

/* ============================================================
   پرسیار
   ============================================================ */
function shuffleWithSeed(arr, seed) {
  var a = arr.slice();
  var s = seed * 9301 + 49297;
  for (var i = a.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    var j = Math.floor((s / 233280) * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function getQuestionForLevel(level) {
  var idx = (level - 1) % questionBank.length;
  var base = questionBank[idx];
  var opts = shuffleWithSeed([base.a].concat(base.w), level);
  return { q: base.q, correct: base.a, options: opts };
}

function loadLevel(level) {
  state.currentLevel = level;
  state.answered = false;
  state.used5050 = false;
  state.usedSkip = false;

  var q = getQuestionForLevel(level);
  state.currentQuestion = q;

  document.getElementById('levelNum').textContent = level;
  document.getElementById('coinNum').textContent = state.coins;
  document.getElementById('progressFill').style.width = ((level - 1) / 1000 * 100) + '%';
  document.getElementById('questionText').textContent = q.q;

  var box = document.getElementById('optionsBox');
  box.innerHTML = '';
  for (var i = 0; i < q.options.length; i++) {
    var opt = q.options[i];
    var div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    (function(d, o) {
      d.onclick = function() { checkAnswer(d, o); };
    })(div, opt);
    box.appendChild(div);
  }

  document.getElementById('help5050').disabled = false;
  document.getElementById('helpSkip').disabled = false;

  renderLevels();
  saveState();
}

function checkAnswer(el, choice) {
  if (state.answered) return;
  state.answered = true;

  var correct = state.currentQuestion.correct;
  var allOpts = document.querySelectorAll('.option');
  for (var i = 0; i < allOpts.length; i++) {
    allOpts[i].classList.add('disabled');
  }

  if (choice === correct) {
    el.classList.add('correct');
    playCorrect();
    state.coins += 20;
    document.getElementById('coinNum').textContent = state.coins;

    if (state.currentLevel + 1 > state.unlockedLevels) {
      state.unlockedLevels = state.currentLevel + 1;
    }

    setTimeout(function() {
      if (state.currentLevel >= 1000) {
        showModal('🎉 پیرۆزە!', 'تەواوی ١٠٠٠ پرسیارت تەواو کرد!');
      } else {
        loadLevel(state.currentLevel + 1);
      }
    }, 800);
  } else {
    el.classList.add('wrong');
    playWrong();
    for (var j = 0; j < allOpts.length; j++) {
      if (allOpts[j].textContent === correct) {
        allOpts[j].classList.add('correct');
      }
    }
    setTimeout(function() {
      showModal('❌ هەڵە!', 'وەڵامی ڕاست: <b>' + correct + '</b><br>دووبارە هەوڵبدە');
    }, 900);
  }
  saveState();
}

function use5050() {
  if (state.used5050 || state.coins < 20 || state.answered) return;
  state.used5050 = true;
  state.coins -= 20;
  document.getElementById('coinNum').textContent = state.coins;
  document.getElementById('help5050').disabled = true;

  var correct = state.currentQuestion.correct;
  var wrongs = [];
  for (var i = 0; i < state.currentQuestion.options.length; i++) {
    if (state.currentQuestion.options[i] !== correct) {
      wrongs.push(state.currentQuestion.options[i]);
    }
  }
  var toRemove = wrongs.slice(0, 2);

  var allOpts = document.querySelectorAll('.option');
  for (var j = 0; j < allOpts.length; j++) {
    if (toRemove.indexOf(allOpts[j].textContent) !== -1) {
      allOpts[j].classList.add('hidden5050');
      allOpts[j].style.pointerEvents = 'none';
    }
  }
  saveState();
}

function skipQuestion() {
  if (state.usedSkip || state.coins < 30 || state.answered) return;
  state.usedSkip = true;
  state.coins -= 30;
  document.getElementById('coinNum').textContent = state.coins;
  document.getElementById('helpSkip').disabled = true;

  if (state.currentLevel + 1 > state.unlockedLevels) {
    state.unlockedLevels = state.currentLevel + 1;
  }
  loadLevel(state.currentLevel + 1);
}

// پەیوەستکردنی دوگمەکانی یارمەتی
document.getElementById('help5050').addEventListener('click', use5050);
document.getElementById('helpSkip').addEventListener('click', skipQuestion);

/* ============================================================
   مەرحەلەکان
   ============================================================ */
function renderLevels() {
  var grid = document.getElementById('levelsGrid');
  if (grid.children.length === 0) {
    for (var i = 1; i <= 1000; i++) {
      var d = document.createElement('div');
      d.className = 'level-item';
      d.dataset.level = i;
      d.innerHTML = '<span>' + i + '</span>';
      (function(lv, el) {
        el.onclick = function() {
          if (lv <= state.unlockedLevels) loadLevel(lv);
        };
      })(i, d);
      grid.appendChild(d);
    }
  }
  var items = grid.children;
  for (var k = 0; k < items.length; k++) {
    var item = items[k];
    var lv = parseInt(item.dataset.level);
    item.classList.remove('locked', 'unlocked', 'current');
    if (lv === state.currentLevel) {
      item.classList.add('current');
      item.innerHTML = '<span>' + lv + '</span>';
    } else if (lv <= state.unlockedLevels) {
      item.classList.add('unlocked');
      item.innerHTML = '<span>' + lv + '</span>';
    } else {
      item.classList.add('locked');
      item.innerHTML = '';
    }
  }
  document.getElementById('unlockedCount').textContent = state.unlockedLevels;
}

/* ============================================================
   مۆدال
   ============================================================ */
function showModal(title, text) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').innerHTML = text;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  loadLevel(state.currentLevel);
}

/* ============================================================
   دەستپێکردن
   ============================================================ */
loadState();
if (state.userEmail) {
  document.getElementById('emailInput').value = state.userEmail;
}
</script>
